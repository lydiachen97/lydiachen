<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resume · Lydia Chen</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
/* 共用基本設定與顏色 */
:root{--cream:#F5EFE3;--card:#FFFDF8;--ink:#2B2723;--soft:#6E655A;--faint:#A79C8C;--line:#E4DBC9;--coral:#E8664E;--butter:#F4C95D}
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;color:var(--ink);font-family:'Noto Sans TC',sans-serif;padding:36px 20px 60px; display: flex; flex-direction: column; align-items: center;}
.wrap{max-width:800px; width: 100%; margin: 40px auto; background: var(--card); border: 2px solid var(--ink); border-radius: 22px; padding: 40px; box-shadow: 8px 8px 0 var(--ink); text-align: center;}
.top{display:flex;align-items:center;justify-content:flex-end;width: 100%; max-width: 800px;}
a.back{font-family:'Space Mono',monospace;font-size:.82rem;color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:20px;padding:7px 16px;background:var(--card);box-shadow:3px 3px 0 var(--ink); transition: 0.2s;}
a.back:hover{background:var(--butter); transform: translateY(-2px);}
h1{font-family:'Fraunces','Noto Sans TC',serif;font-weight:600;font-size:2.8rem; margin-bottom: 10px;}
.sub{color:var(--soft);margin:2px 0 32px;font-size:1.1rem;}

/* 下載按鈕專屬設計 */
.download-btn { display: inline-flex; align-items: center; gap: 10px; background: var(--coral); color: #fff; padding: 16px 32px; font-size: 1.2rem; font-weight: 700; font-family: 'Space Mono', monospace; text-decoration: none; border: 2px solid var(--ink); border-radius: 30px; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 4px 4px 0 var(--ink); cursor: pointer; }
.download-btn:hover { transform: translateY(-4px); box-shadow: 6px 6px 0 var(--ink); background: #C94A34; }

/* 你的專屬背景特效 */
.background { position: fixed; z-index: -1; overflow: hidden; width: 100vw; height: 100vh; top: 0; left: 0; background: linear-gradient(to right, #c5eafc, #fff1ad); display: flex; flex-grow: 1; }
.background div { position: absolute; border-radius: 100%; height: 0; filter: blur(120px); opacity: 0.4; }
.background div:nth-child(1) { background: linear-gradient(132deg, #1FCFC3 0.00%, #1F91CF 100.00%); width: 30%; padding-top: 30%; left: 39%; top: 22%; transform: translateX(-50%) translateY(-50%); }
.background div:nth-child(2) { background: linear-gradient(132deg, #0800FF 0.00%, #E32BE3 100.00%); width: 40%; padding-top: 40%; left: 50%; top: 50%; transform: translateX(-50%) translateY(-50%); }
.background div:nth-child(3) { background: linear-gradient(132deg, #1FCFC3 0.00%, #1F91CF 100.00%); width: 30%; padding-top: 30%; left: 80%; top: 80%; transform: translateX(-50%) translateY(-50%); }
</style>
</head>
<body>
<!-- 背景 -->
<div class="background"><div></div><div></div><div></div></div>

<div class="top">
  <a class="back" href="index.html">← 回首頁</a>
</div>

<div class="wrap">
  <h1>Lydia Chen</h1>
  <p class="sub">Quality Engineer · Supply Chain</p>
  
  <!-- 這裡的 href 請換成你實際的 PDF 檔案名稱 -->
  <a href="Lydia_Chen_Resume.pdf" download="Lydia_Chen_Resume.pdf" class="download-btn">
    📄 Download PDF Resume
  </a>
</div>

</body>
</html>
